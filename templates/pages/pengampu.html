<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'style/header.html' %}
  {% include 'style/headKMG.html' %}
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="g-sidenav-show bg-gray-100">
  <div class="min-height-300 bg-dark position-absolute w-100"></div>

  {% include 'style/aside.html' %}

  <main class="main-content position-relative border-radius-lg">
    {% include 'style/navbar.html' %}

    <div class="container-fluid py-4">
      <div class="card mb-4">

        <!-- HEADER -->
        <div class="card-header pb-0">
          <h6>Data Guru Pengampu</h6>

          <!-- FILTER -->
          <form method="get" class="row mt-3 g-2">
            <div class="col-md-6">
              <input type="text" name="mapel" class="form-control"
                     placeholder="Cari mapel..."
                     value="{{ mapel_filter }}">
            </div>
            <div class="col-md-auto">
              <button class="btn btn-primary">
                <i class="fas fa-search me-1"></i>Cari
              </button>
              <a href="{{ url_for('daftar_pengampu') }}"
                 class="btn btn-secondary">
                Reset
              </a>
            </div>
          </form>
        </div>

        <!-- BODY -->
        <div class="card-body pt-0">
          <div class="table-responsive">
            <table class="table table-borderless modern-table align-middle">
              <thead>
                <tr>
                  <th class="text-xs text-muted">Mata Pelajaran</th>
                  <th class="text-xs text-muted">Guru Pengampu</th>
                </tr>
              </thead>

              <tbody id="pengampu-table-body">
                <!-- DIISI VIA JS -->
              </tbody>
            </table>
          </div>

          <!-- PAGINATION -->
          <nav class="mt-4">
            <ul class="pagination justify-content-end" id="pagination">
                id="pagination"></ul>
          </nav>
        </div>
      </div>
    </div>
  </main>

  <!-- DATA JSON -->
  <div id="pengampu-data"
       data-json='{{ data | tojson | safe }}'></div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let pengampuData = [];
    let currentPage = 1;
    const rowsPerPage = 10;

    function renderTable() {
      const tbody = $('#pengampu-table-body');
      tbody.empty();

      const start = (currentPage - 1) * rowsPerPage;
      const sliced = pengampuData.slice(start, start + rowsPerPage);

      if (sliced.length === 0) {
        tbody.append(`
          <tr>
            <td colspan="2" class="text-center text-muted py-4">
              Tidak ada data.
            </td>
          </tr>
        `);
        return;
      }

      sliced.forEach(item => {
        let badges = '';
        item.guru.forEach(g =>
          badges += `<span class="badge bg-gradient-primary px-3 py-2">${g}</span>`
        );

        tbody.append(`
          <tr>
            <td class="fw-semibold">${item.mapel}</td>
            <td><div class="d-flex flex-wrap gap-2">${badges}</div></td>
          </tr>
        `);
      });

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(pengampuData.length / rowsPerPage);
      const pagination = $('#pagination');
      pagination.empty();

      for (let i = 1; i <= totalPages; i++) {
        pagination.append(`
          <li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#">${i}</a>
          </li>
        `);
      }

      $('.page-link').click(function(e){
        e.preventDefault();
        currentPage = parseInt($(this).text());
        renderTable();
      });
    }

    $(document).ready(function () {
      pengampuData = $('#pengampu-data').data('json');
      renderTable();
    });
  </script>

  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/argon-dashboard.min.js"></script>
</body>
</html>

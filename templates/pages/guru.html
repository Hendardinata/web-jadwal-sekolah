<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'style/header.html' %}
  {% include 'style/headKMG.html' %}
</head>

<body class="g-sidenav-show bg-gray-100">
  <div class="min-height-300 bg-dark position-absolute w-100"></div>

  {% include 'style/aside.html' %}

  <main class="main-content position-relative border-radius-lg">
    
    {% include 'style/navbar.html' %}

    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-12">

          <!-- CARD: TAMBAH GURU -->
          <div class="card mb-4">
            <div class="card-header pb-0">
              <h6>Tambah Guru Baru</h6>
            </div>

            <div class="card-body px-4 pt-4 pb-2">
              <form method="POST">
                <div class="mb-3">
                  <label class="form-label">Nama Guru</label>
                  <input type="text" class="form-control"
                         name="guru" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="d-flex">
                  <button type="submit" class="btn bg-gradient-info me-2">
                    <i class="fas fa-save me-1"></i>Tambah
                  </button>
                  <a href="{{ url_for('dashboard') }}" class="btn bg-gradient-warning">
                    <i class="fas fa-arrow-left me-1"></i>Kembali
                  </a>
                </div>
              </form>
            </div>
          </div>

          <!-- CARD: DAFTAR GURU -->
          <div class="card">
            <div class="card-header pb-0">
              <h6 class="text-uppercase text-sm mb-0">Daftar Guru Saat Ini</h6>
            </div>

            <div class="card-body pt-0">
              <!-- DATA JSON -->
              <div id="guru-data" data-json='{{ daftar_guru | tojson | safe }}'></div>

              <div class="table-responsive">
                <table class="table table-borderless modern-table align-middle mb-0">
                  <thead>
                    <tr>
                      <th style="width: 60px;">No</th>
                      <th>Nama Guru</th>
                      <th style="width: 220px;">Action</th>
                    </tr>
                  </thead>

                  <tbody id="guru-table-body">
                    <!-- Diisi oleh JS -->
                  </tbody>
                </table>
              </div>

              <!-- PAGINATION -->
              <nav class="mt-4">
                <ul class="pagination justify-content-end" id="pagination"></ul>
              </nav>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- CORE JS (TIDAK DIUBAH) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let guruData = [];
    let currentPage = 1;
    const rowsPerPage = 10;

    function renderTable() {
      const tbody = $('#guru-table-body');
      tbody.empty();

      const start = (currentPage - 1) * rowsPerPage;
      const slicedData = guruData.slice(start, start + rowsPerPage);

      if (slicedData.length === 0) {
        tbody.append('<tr><td colspan="3" class="text-center text-muted py-4">Belum ada data guru.</td></tr>');
        return;
      }

      slicedData.forEach((g, i) => {
        const no = start + i + 1;
        tbody.append(`
          <tr>
            <td>${no}</td>
            <td class="fw-semibold">${g.guru}</td>
            <td>
              <div class="d-flex justify-content-center gap-2">
                <a href="/guru_edit/${encodeURIComponent(g.guru)}"
                   class="btn btn-sm btn-warning">
                  <i class="fas fa-edit me-1"></i>Edit
                </a>
                <form method="POST" action="/guru/hapus"
                      onsubmit="return confirm('Yakin ingin menghapus guru ini?')">
                  <input type="hidden" name="guru" value="${g.guru}">
                  <button class="btn btn-sm btn-danger">
                    <i class="fas fa-trash me-1"></i>Hapus
                  </button>
                </form>
              </div>
            </td>
          </tr>
        `);
      });

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(guruData.length / rowsPerPage);
      const pagination = $('#pagination');
      pagination.empty();

      for (let i = 1; i <= totalPages; i++) {
        pagination.append(`
          <li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link page-num" href="#">${i}</a>
          </li>
        `);
      }

      $('.page-num').click(function (e) {
        e.preventDefault();
        currentPage = parseInt($(this).text());
        renderTable();
      });
    }

    $(document).ready(function () {
      guruData = $('#guru-data').data('json');
      renderTable();
    });
  </script>

  <!-- ARGON -->
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/argon-dashboard.min.js?v=2.0.4"></script>
</body>
</html>
